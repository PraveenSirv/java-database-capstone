<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}" />
  <title>Doctor Dashboard</title>
  <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}" />
  <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}" />
  <link rel="stylesheet" th:href="@{/assets/css/style.css}" />
  
  <script th:src="@{/js/render.js}" defer></script>
  <script th:src="@{/js/util.js}" defer></script>
  <script type="module" th:src="@{/js/components/header.js}" defer></script>
  <script type="module" th:src="@{/js/components/footer.js}" defer></script>
</head>
<body onload="renderContent()">
  <div class="container">
    <div class="wrapper">
      <div id="header"></div>
      
      <main class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
          <input type="text" id="searchBar" class="searchBar" placeholder="Search Patients by Name..." style="margin-bottom: 0;" />
          <div style="display: flex; align-items: center; gap: 10px;">
            <button id="todayButton" class="adminBtn">Today</button>
            <input type="date" id="datePicker" class="input-field" style="width: auto; margin-top: 0; margin-bottom: 0;" />
          </div>
        </div>
        
        <table class="patient-table" style="width: 100%; border-collapse: collapse; margin-top: 20px;">
          <thead>
            <tr>
              <th>Patient ID</th>
              <th>Name</th>
              <th>Phone No.</th>
              <th>Email</th>
              <th>Prescription</th>
            </tr>
          </thead>
          <tbody id="patientTableBody"></tbody>
        </table>
      </main>
      
      <div id="footer"></div>
    </div>
  </div>

  <script type="module" th:src="@{/js/doctorDashboard.js}" defer></script>
</body>
</html>
